version: "3.9"

services:

  # ─────────────────────────────────────────────
  # PostgreSQL — your analytics warehouse
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sma_postgres
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d   # auto-runs on first start
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Redis — conversation memory + caching
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sma_redis
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout:  5s
      retries:  5
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # FastAPI — AI analytics backend
  # ─────────────────────────────────────────────
  api:
    build:
      context:    .
      dockerfile: docker/Dockerfile
    container_name: sma_api
    environment:
      # Database
      DB_HOST:     postgres
      DB_PORT:     5432
      DB_NAME:     ${DB_NAME}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Redis
      REDIS_HOST:     redis
      REDIS_PORT:     6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      # AI
      GROQ_API_KEY: ${GROQ_API_KEY}
      GROQ_MODEL:   ${GROQ_MODEL:-llama-3.1-8b-instant}
      # App
      APP_ENV:   production
      APP_DEBUG: "false"
      API_KEYS:  ${API_KEYS:-}
    volumes:
      - chroma_data:/data/chroma_db    # persist vector embeddings
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout:  10s
      retries:  3
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  chroma_data: