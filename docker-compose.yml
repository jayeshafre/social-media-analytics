services:

  # ─────────────────────────────────────────
  # SERVICE 1: PostgreSQL
  # ─────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: sma_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: social_media_analytics
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # SERVICE 2: Redis
  # ─────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sma_redis
    restart: unless-stopped

    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1

    ports:
      - "6380:6379"

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────
  # SERVICE 3: FastAPI Backend
  # ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile

    container_name: sma_api
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: social_media_analytics
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD}

      REDIS_HOST: redis
      REDIS_PORT: 6379

      GROQ_API_KEY: ${GROQ_API_KEY}

      APP_ENV: production
      APP_DEBUG: "False"

    ports:
      - "8000:8000"

    volumes:
      - ./data:/app/data

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─────────────────────────────────────────
  # SERVICE 4: Apache Superset
  # ─────────────────────────────────────────
  superset:
    image: apache/superset:4.0.2
    container_name: sma_superset
    restart: unless-stopped

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}

      SQLALCHEMY_DATABASE_URI: >-
        postgresql+psycopg2://postgres:${DB_PASSWORD}@postgres:5432/superset_meta

      WTF_CSRF_ENABLED: "False"
      SUPERSET_WEBSERVER_TIMEOUT: "300"

    ports:
      - "8088:8088"

    volumes:
      - superset_home:/app/superset_home
      - ./docker/superset_config.py:/app/pythonpath/superset_config.py

    command: >
      /bin/sh -c '
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname Admin
      --lastname User
      --email admin@superset.com
      --password admin || true &&
      superset init &&
      gunicorn
      --bind 0.0.0.0:8088
      --workers 2
      --timeout 300
      "superset.app:create_app()"
      '

# ─────────────────────────────────────────
# Named Volumes
# ─────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  superset_home: